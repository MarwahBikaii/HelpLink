<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get help</title>
    <link rel="stylesheet" href="./style/index.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style/help.css" />

    <link rel="stylesheet" href="./style/editProfile.css" />
  </head>
  <body>
    <nav class="navbar">
      <img src="./images/logo.png" alt="HelpLink-logo" />
      <ul class="link-list">
        <li><a href="requests.html">Help requests</a></li>
        <li>
          <a href="testimonials"><i class="bi bi-bell"></i>notifications</a>
        </li>
        <li>
          <a href="#contact"> <i class="bi bi-person-circle"></i> </a>
          Profile
        </li>
      </ul>

      <a href="" class="get-started">Logout</a>
    </nav>
    <section class="edit-profile-section">
      <form action="submit">
        <h1>Edit Profile</h1>

        <div class="text-input-div firstname">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" />
        </div>
        <div class="text-input-div">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" />
        </div>

        <div class="input-container">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <div class="input-container">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" />
        </div>
        <div class="input-container">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" />
        </div>
        <div class="text-input-div">
          <label for="about">About me</label>
          <textarea type="text" id="about" name="about"></textarea>
        </div>

        <div class="location-container">
          <div class="text-input-div">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" />
          </div>
          <div class="text-input-div">
            <label for="city">City</label>
            <input type="text" id="city" name="city" />
          </div>
        </div>

        <div class="skills-container">
          <h4>Skills to match</h4>
          <label
            for="
            skills"
          >
            <select name="skills" id="skills">
              <option value="React">React.js</option>
              <option value="node">node.js</option>
              <option value="mongodb">MongoDB</option>
              <option value="express">Express.js</option>
            </select></label
          >
        </div>

        <div>
          <h4>CV</h4>
          <label
            for="
            cv"
          ></label>
          <input type="file" id="cv" name="cv" />
        </div>

        <div>
          <h4>Profile Picture</h4>
          <label
            for="
            pp"
          ></label>
          <input type="file" id="pp" name="pp" />
        </div>

        <div class="cc">  <label for="social-media">
            <h4>Social media</h4>
            <select name="social-media" id="social-media">
              <option value="Instagram">Instagram</option>
              <option value="LinkedIn">LinkedIn</option>
            </select>
          </label>
        
           <label
            for="
        Instagram"
            >URL</label
          >
          <input type="text" name="Instagram" id="Instagram" />
        </div>
        
         
        </div>

      </form>
              <button class="submit-button">Submit</button>

    </section>
  </body>
</html>
